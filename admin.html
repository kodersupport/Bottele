<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Shop - Quản lý sản phẩm & đơn hàng</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active { background: var(--primary); border-color: var(--primary); }
    .tab:hover:not(.active) { background: #334155; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h3 { margin-bottom: 16px; font-size: 1.1rem; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .type-row {
      display: grid;
      grid-template-columns: 1fr 120px 100px 40px;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .type-row input { margin-bottom: 0; }
    .product-item, .order-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: #0f172a;
    }
    .product-item h4, .order-item h4 { margin-bottom: 8px; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pending { background: #334155; color: #e2e8f0; }
    .badge-waiting { background: #854d0e; color: #fef3c7; }
    .badge-paid { background: #14532d; color: #bbf7d0; }
    .badge-cancelled { background: #7f1d1d; color: #fecaca; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--danger); }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }
    .modal h3 { margin-bottom: 12px; }
    .modal .btn-group { margin-top: 16px; }
    @media (max-width: 700px) {
      .type-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 Admin Shop</h1>
    <p class="subtitle">Quản lý sản phẩm, tồn kho & đơn hàng · Lưu trên JSONBin</p>

    <div class="status-bar">
      <div>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Đang kết nối...</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="loadData()">🔄 Làm mới</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="products">Sản phẩm</div>
      <div class="tab" data-tab="orders">Đơn hàng</div>
      <div class="tab" data-tab="add">+ Thêm sản phẩm</div>
    </div>

    <div class="panel active" id="panel-products">
      <div id="productsList"></div>
    </div>

    <div class="panel" id="panel-orders">
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="filterOrders('all')">Tất cả</button>
          <button class="btn btn-sm btn-warning" onclick="filterOrders('waiting_confirm')">Chờ duyệt</button>
          <button class="btn btn-sm" onclick="filterOrders('pending')">Chờ TT</button>
          <button class="btn btn-sm btn-success" onclick="filterOrders('paid')">Đã giao Key</button>
        </div>
      </div>
      <div id="ordersList"></div>
    </div>

    <div class="panel" id="panel-add">
      <div class="card">
        <h3>Thêm sản phẩm mới</h3>
        <label>Tên sản phẩm</label>
        <input type="text" id="prodName" placeholder="Ví dụ: FLORK Premium">

        <label>Các loại / Gói (mỗi loại có giá & số lượng riêng)</label>
        <div id="typesContainer">
          <div class="type-row">
            <input type="text" placeholder="Tên loại (1 tháng / VIP...)" class="type-name">
            <input type="number" placeholder="Giá (VND)" class="type-price" min="0">
            <input type="number" placeholder="Tồn kho" class="type-stock" min="0" value="0">
            <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>
          </div>
        </div>
        <button class="btn btn-sm" style="background:#334155;color:white;margin-bottom:16px" onclick="addTypeRow()">+ Thêm loại</button>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="addProduct()">💾 Lưu sản phẩm</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h3>Gửi Key cho khách</h3>
      <p class="meta" id="modalOrderInfo" style="margin-bottom:12px"></p>
      <label>Nhập Key / Mã kích hoạt</label>
      <input type="text" id="keyInput" placeholder="Dán key vào đây...">
      <div class="btn-group">
        <button class="btn btn-success" onclick="confirmSendKey()">✅ Gửi Key & Duyệt</button>
        <button class="btn" style="background:#334155;color:white" onclick="closeKeyModal()">Hủy</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const BIN_ID = '6b041f24ffd5d16053d776ed';
    const MASTER_KEY = '$2a$10$E3TfVjjxGA2Dy1881YzVOO.kjLRnQigWfUWmK5vj3Ny8h2gCbTl9e';
    const BOT_TOKEN = '9131951452:AAF5vKlpd4fZQd94ww6KEABiHJiT-gBKDAs';
    const API = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let data = { products: [], orders: [] };
    let currentFilter = 'all';
    let pendingOrderId = null;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });

    async function loadData() {
      setStatus('loading');
      try {
        const res = await fetch(API + '/latest', {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!res.ok) throw new Error('Lỗi tải dữ liệu');
        const json = await res.json();
        data = json.record || { products: [], orders: [] };
        if (!data.products) data.products = [];
        if (!data.orders) data.orders = [];
        renderProducts();
        renderOrders();
        setStatus('ok');
      } catch (e) {
        console.error(e);
        setStatus('err');
        toast('Không kết nối được JSONBin', true);
      }
    }

    async function saveData() {
      try {
        const res = await fetch(API, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY,
            'X-Bin-Versioning': 'false'
          },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Lỗi lưu');
        return true;
      } catch (e) {
        console.error(e);
        toast('Lỗi khi lưu dữ liệu', true);
        return false;
      }
    }

    async function sendTelegram(chatId, text) {
      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: text,
            parse_mode: 'Markdown'
          })
        });
        return res.ok;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    function renderProducts() {
      const el = document.getElementById('productsList');
      if (!data.products.length) {
        el.innerHTML = '<div class="empty">Chưa có sản phẩm nào.<br>Sang tab "+ Thêm sản phẩm" để tạo.</div>';
        return;
      }
      el.innerHTML = data.products.map(p => `
        <div class="product-item">
          <h4>${escapeHtml(p.name)}</h4>
          <div class="meta">ID: ${p.id}</div>
          <div style="margin:10px 0">
            ${p.types.map(t => `
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e293b">
                <span>${escapeHtml(t.name)}</span>
                <span>
                  <strong>${formatMoney(t.price)}</strong>
                  · Tồn: <b style="color:${t.stock > 0 ? '#22c55e' : '#ef4444'}">${t.stock}</b>
                </span>
              </div>
            `).join('')}
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-warning" onclick="editProduct('${p.id}')">✏️ Sửa</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️ Xóa</button>
          </div>
        </div>
      `).join('');
    }

    function addTypeRow(name = '', price = '', stock = 0) {
      const container = document.getElementById('typesContainer');
      const row = document.createElement('div');
      row.className = 'type-row';
      row.innerHTML = `
        <input type="text" placeholder="Tên loại" class="type-name" value="${escapeHtml(name)}">
        <input type="number" placeholder="Giá (VND)" class="type-price" min="0" value="${price}">
        <input type="number" placeholder="Tồn kho" class="type-stock" min="0" value="${stock}">
        <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    async function addProduct() {
      const name = document.getElementById('prodName').value.trim();
      if (!name) return toast('Nhập tên sản phẩm', true);

      const rows = document.querySelectorAll('#typesContainer .type-row');
      const types = [];
      rows.forEach(row => {
        const tName = row.querySelector('.type-name').value.trim();
        const price = parseInt(row.querySelector('.type-price').value) || 0;
        const stock = parseInt(row.querySelector('.type-stock').value) || 0;
        if (tName && price > 0) {
          types.push({
            id: 't_' + Date.now() + Math.random().toString(36).slice(2, 6),
            name: tName,
            price,
            stock
          });
        }
      });

      if (!types.length) return toast('Thêm ít nhất 1 loại có giá > 0', true);

      data.products.push({
        id: 'p_' + Date.now(),
        name,
        types
      });

      if (await saveData()) {
        toast('Đã thêm sản phẩm thành công');
        document.getElementById('prodName').value = '';
        document.getElementById('typesContainer').innerHTML = '';
        addTypeRow();
        renderProducts();
        document.querySelector('[data-tab="products"]').click();
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Xóa sản phẩm này?')) return;
      data.products = data.products.filter(p => p.id !== id);
      if (await saveData()) {
        toast('Đã xóa sản phẩm');
        renderProducts();
      }
    }

    function editProduct(id) {
      const p = data.products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('prodName').value = p.name;
      const container = document.getElementById('typesContainer');
      container.innerHTML = '';
      p.types.forEach(t => addTypeRow(t.name, t.price, t.stock));
      data.products = data.products.filter(x => x.id !== id);
      document.querySelector('[data-tab="add"]').click();
      toast('Đã load sản phẩm để sửa. Sửa xong bấm Lưu.');
    }

    function filterOrders(status) {
      currentFilter = status;
      renderOrders();
    }

    function renderOrders() {
      const el = document.getElementById('ordersList');
      let list = [...data.orders].reverse();
      if (currentFilter !== 'all') {
        list = list.filter(o => o.status === currentFilter);
      }

      if (!list.length) {
        el.innerHTML = '<div class="empty">Không có đơn hàng nào.</div>';
        return;
      }

      el.innerHTML = list.map(o => {
        const badgeClass = {
          pending: 'badge-pending',
          waiting_confirm: 'badge-waiting',
          paid: 'badge-paid',
          cancelled: 'badge-cancelled'
        }[o.status] || 'badge-pending';

        const statusText = {
          pending: 'Chờ thanh toán',
          waiting_confirm: 'Chờ duyệt & gửi Key',
          paid: 'Đã giao Key',
          cancelled: 'Đã hủy'
        }[o.status] || o.status;

        return `
          <div class="order-item">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
              <div>
                <h4>${escapeHtml(o.productName)} · ${escapeHtml(o.typeName)}</h4>
                <div class="meta">Mã đơn: <b>${o.id}</b></div>
                <div class="meta">Khách: ${escapeHtml(o.fullName || o.username || o.userId)} (@${escapeHtml(o.username || '—')})</div>
                <div class="meta">Thời gian: ${formatDate(o.createdAt)}</div>
                <div class="meta">Nội dung CK: <code>${o.paymentNote || o.id}</code></div>
                ${o.key ? `<div class="meta">Key đã gửi: <code>${escapeHtml(o.key)}</code></div>` : ''}
              </div>
              <div style="text-align:right">
                <div style="font-size:1.2rem;font-weight:700;margin-bottom:6px">${formatMoney(o.price)}</div>
                <span class="badge ${badgeClass}">${statusText}</span>
              </div>
            </div>
            ${o.status === 'waiting_confirm' ? `
              <div class="btn-group" style="margin-top:12px">
                <button class="btn btn-sm btn-success" onclick="openKeyModal('${o.id}')">🔑 Duyệt & Gửi Key</button>
                <button class="btn btn-sm btn-danger" onclick="cancelOrder('${o.id}')">❌ Hủy đơn</button>
              </div>
            ` : ''}
            ${o.status === 'pending' ? `
              <div class="btn-group" style="margin-top:12px">
                <button class="btn btn-sm btn-danger" onclick="cancelOrder('${o.id}')">❌ Hủy đơn</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function openKeyModal(orderId) {
      const order = data.orders.find(o => o.id === orderId);
      if (!order) return;
      pendingOrderId = orderId;
      document.getElementById('modalOrderInfo').textContent = 
        `${order.productName} · ${order.typeName} · ${formatMoney(order.price)} · ${order.fullName || order.username}`;
      document.getElementById('keyInput').value = '';
      document.getElementById('keyModal').classList.add('show');
      document.getElementById('keyInput').focus();
    }

    function closeKeyModal() {
      document.getElementById('keyModal').classList.remove('show');
      pendingOrderId = null;
    }

    async function confirmSendKey() {
      const key = document.getElementById('keyInput').value.trim();
      if (!key) return toast('Vui lòng nhập Key', true);
      if (!pendingOrderId) return;

      const order = data.orders.find(o => o.id === pendingOrderId);
      if (!order) return;

      const product = data.products.find(p => p.id === order.productId);
      if (product) {
        const type = product.types.find(t => t.id === order.typeId);
        if (type) {
          if (type.stock < 1) {
            return toast('Hết hàng! Không thể duyệt.', true);
          }
          type.stock -= 1;
        }
      }

      order.status = 'paid';
      order.key = key;
      order.paidAt = new Date().toISOString();

      if (!(await saveData())) return;

      const msg =
`🌟 *MUA HÀNG THÀNH CÔNG* 🌟

⚡️ *TÊN SẢN PHẨM:* ${order.productName}
🔫 *LOẠI:* ${order.typeName}
⚔️ *GIÁ:* ${formatMoney(order.price)}
🔑 *KEY CỦA BẠN:* \`${key}\``;

      const sent = await sendTelegram(order.userId, msg);

      closeKeyModal();
      renderOrders();
      renderProducts();

      if (sent) {
        toast('Đã gửi Key cho khách thành công!');
      } else {
        toast('Đã duyệt nhưng gửi tin nhắn thất bại. Kiểm tra lại.', true);
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm('Hủy đơn này?')) return;
      const order = data.orders.find(o => o.id === orderId);
      if (!order) return;
      order.status = 'cancelled';
      if (await saveData()) {
        toast('Đã hủy đơn');
        renderOrders();
      }
    }

    function setStatus(state) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (state === 'ok') {
        dot.className = 'status-dot ok';
        text.textContent = 'Đã kết nối JSONBin · ' + data.products.length + ' SP · ' + data.orders.length + ' đơn';
      } else if (state === 'err') {
        dot.className = 'status-dot err';
        text.textContent = 'Lỗi kết nối JSONBin';
      } else {
        dot.className = 'status-dot';
        text.textContent = 'Đang tải...';
      }
    }

    function toast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.borderColor = isError ? '#ef4444' : '#22c55e';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function formatMoney(n) {
      return new Intl.NumberFormat('vi-VN').format(n) + 'đ';
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('vi-VN');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    addTypeRow();
    loadData();
    setInterval(() => {
      if (document.getElementById('panel-orders').classList.contains('active')) {
        loadData();
      }
    }, 15000);
  </script>
</body>
</html>
